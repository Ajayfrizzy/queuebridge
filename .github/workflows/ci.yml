name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'staging']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# timeout-minutes (MQ.2): about 4x the slowest observed run on PR #10 (lint 1.3 min, tests 1.1,
# PostgreSQL + Playwright 9.4, build 0.8, audit 0.3), never under 15. A hung tool (for example a
# pathological glob, GHSA-fc5q-39xc-vjpf) is stopped instead of running for GitHub's 6-hour default.
jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build dependency packages for typecheck
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests (without DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/queuebridge_test
          SESSION_SECRET: ci-test-session-secret-placeholder-at-least-32-chars
          CORS_ORIGIN: http://localhost:5173

  test-db:
    name: Tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queuebridge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run migrations
        run: node infra/scripts/migrate.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/queuebridge_test

      - name: Run DB tests
        run: pnpm test:db
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/queuebridge_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/queuebridge_test
          SESSION_SECRET: ci-test-session-secret-placeholder-at-least-32-chars

      - name: Install Playwright Chromium
        run: pnpm --filter @queuebridge/web exec playwright install --with-deps chromium

      - name: Run browser tests (real API + PostgreSQL + built web app)
        run: pnpm --filter @queuebridge/web test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/queuebridge_test

  build:
    name: Build all packages and apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:3002
          VITE_APP_ENV: production

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies: blocking, with no exception of any kind
      - name: Production dependency audit (no exceptions)
        run: pnpm audit --prod --audit-level high
      # Complete dependency tree: every high/critical advisory blocks unless it matches an
      # approved, unexpired, path-exact exception in infra/security/audit-policy.json
      # (GHSA-fc5q-39xc-vjpf, development tools only, expires 2026-12-15). Malformed output,
      # command failures and an available upstream fix all fail this step.
      - name: Full dependency audit through the scoped policy
        run: node infra/scripts/audit-gate.js
